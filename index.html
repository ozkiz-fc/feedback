<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>매니저 품평회 피드백 반영현황</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root {
  --bg: #F5F7FB;
  --surface: #FFFFFF;
  --surface-2: #F0F3FA;
  --text: #1A2340;
  --text-2: #566280;
  --text-3: #9AA3BC;
  --border: #E4E9F4;
  --navy: #1A2B50;
  --navy-light: #243566;
  --accent: #2E6FE8;
  --accent-light: #EEF4FF;
  --ongoing-bg: #EBF3FF;
  --ongoing-fg: #1A55C4;
  --review-bg: #FFF4E6;
  --review-fg: #C26000;
  --tag-bg: #EDF0F9;
  --tag-fg: #566280;
  --ans-bg: #F7FAF3;
  --ans-border: #C8DDB8;
  --ans-fg: #3A5C22;
  --shadow-sm: 0 1px 3px rgba(26,43,80,.06);
  --shadow: 0 2px 8px rgba(26,43,80,.08);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1524;
    --surface: #16202E;
    --surface-2: #1C2840;
    --text: #E8EDF8;
    --text-2: #8B97BE;
    --text-3: #4A5878;
    --border: #232F48;
    --navy: #0B1220;
    --navy-light: #16202E;
    --accent: #5B8FFA;
    --accent-light: #162040;
    --ongoing-bg: #162040;
    --ongoing-fg: #7AACFF;
    --review-bg: #2A1C00;
    --review-fg: #FFB040;
    --tag-bg: #1C2840;
    --tag-fg: #8B97BE;
    --ans-bg: #141E10;
    --ans-border: #2A4018;
    --ans-fg: #88C060;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.2);
    --shadow: 0 2px 8px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  --bg: #0E1524;
  --surface: #16202E;
  --surface-2: #1C2840;
  --text: #E8EDF8;
  --text-2: #8B97BE;
  --text-3: #4A5878;
  --border: #232F48;
  --navy: #0B1220;
  --navy-light: #16202E;
  --accent: #5B8FFA;
  --accent-light: #162040;
  --ongoing-bg: #162040;
  --ongoing-fg: #7AACFF;
  --review-bg: #2A1C00;
  --review-fg: #FFB040;
  --tag-bg: #1C2840;
  --tag-fg: #8B97BE;
  --ans-bg: #141E10;
  --ans-border: #2A4018;
  --ans-fg: #88C060;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.2);
  --shadow: 0 2px 8px rgba(0,0,0,.25);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

/* HEADER */
.page-header {
  background: var(--navy);
  padding: 26px 20px 22px;
}
.page-header-inner { max-width: 720px; margin: 0 auto; }
.page-eyebrow {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: rgba(255,255,255,.38);
  margin-bottom: 6px;
}
.page-title {
  font-size: clamp(21px, 4.5vw, 26px);
  font-weight: 700;
  color: #fff;
  text-wrap: balance;
  margin-bottom: 16px;
  line-height: 1.3;
}
.meta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px 16px;
  font-size: 13.5px;
}
.meta-item { display: flex; align-items: center; gap: 5px; }
.meta-label { color: rgba(255,255,255,.35); }
.meta-value { color: rgba(255,255,255,.8); font-weight: 500; }

/* STATS */
.stats-bar {
  background: var(--navy-light);
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.stats-inner {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
}
.stat-cell {
  flex: 1;
  padding: 13px 0;
  text-align: center;
  border-right: 1px solid rgba(255,255,255,.07);
  color: #fff;
}
.stat-cell:last-child { border-right: none; }
.stat-num {
  font-size: 22px;
  font-weight: 700;
  display: block;
  font-variant-numeric: tabular-nums;
}
.stat-label {
  font-size: 10.5px;
  color: rgba(255,255,255,.4);
  display: block;
  margin-top: 1px;
}
.stat-ongoing .stat-num { color: #7AACFF; }
.stat-review .stat-num { color: #FFB870; }

/* FILTER */
.filter-zone {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  box-shadow: 0 2px 10px rgba(26,43,80,.07);
}
.filter-inner {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.search-box {
  display: flex;
  align-items: center;
  background: var(--surface-2);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 7px 12px;
  gap: 8px;
}
.search-icon { color: var(--text-3); font-size: 14px; flex-shrink: 0; }
.search-input {
  border: none; background: transparent;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 16px; color: var(--text);
  flex: 1; min-width: 0; outline: none;
}
.search-input::placeholder { color: var(--text-3); }
.chip-row {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  -ms-overflow-style: none;
  padding-bottom: 2px;
}
.chip-row::-webkit-scrollbar { display: none; }
.chip {
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--text-2);
  font-family: 'Noto Sans KR', sans-serif;
  transition: all .15s;
  white-space: nowrap;
  flex-shrink: 0;
  min-height: 36px;
  display: inline-flex;
  align-items: center;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.ongoing.active { background: var(--ongoing-fg); border-color: var(--ongoing-fg); }
.chip.review.active { background: var(--review-fg); border-color: var(--review-fg); }

/* MAIN */
.main { max-width: 720px; margin: 0 auto; padding: 14px 20px 60px; }
.result-count {
  font-size: 12px; color: var(--text-3);
  margin-bottom: 10px;
  font-variant-numeric: tabular-nums;
}
.result-count strong { color: var(--text-2); font-weight: 600; }

/* CARD */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  margin-bottom: 8px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .15s;
}
.card:hover { box-shadow: var(--shadow); }
.card-header {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 13px 14px 11px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  min-height: 44px;
}
.card-num {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  min-width: 20px;
  padding-top: 3px;
  flex-shrink: 0;
}
.card-body-text { flex: 1; min-width: 0; }
.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 5px;
}
.tag {
  font-size: 12px;
  font-weight: 500;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--tag-bg);
  color: var(--tag-fg);
}
.tag.deadline {
  background: var(--accent-light);
  color: var(--accent);
}
.card-request {
  font-size: 15px;
  color: var(--text);
  line-height: 1.55;
  margin-bottom: 0;
}
/* ANSWER PREVIEW on collapsed card */
.card-ans-preview {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  margin-top: 7px;
  padding: 7px 9px;
  background: var(--ans-bg);
  border-left: 2.5px solid var(--ans-border);
  border-radius: 0 5px 5px 0;
}
.ans-icon { font-size: 11px; flex-shrink: 0; margin-top: 1px; }
.ans-preview-text {
  font-size: 13px;
  color: var(--ans-fg);
  line-height: 1.5;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.card-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 5px;
  flex-shrink: 0;
}
.status-badge {
  font-size: 12px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 20px;
  white-space: nowrap;
}
.status-ongoing { background: var(--ongoing-bg); color: var(--ongoing-fg); }
.status-review { background: var(--review-bg); color: var(--review-fg); }
.chevron {
  font-size: 11px;
  color: var(--text-3);
  transition: transform .2s;
}
.card.open .chevron { transform: rotate(180deg); }

.card-detail {
  display: none;
  padding: 12px 14px 14px 44px;
  border-top: 1px solid var(--border);
  background: var(--bg);
}
.card.open .card-detail { display: block; }
.detail-label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 5px;
  margin-top: 12px;
}
.detail-label:first-child { margin-top: 0; }
.detail-ans {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--ans-border);
  border-radius: 0 8px 8px 0;
  padding: 10px 12px;
  font-size: 14px;
  color: var(--text-2);
  line-height: 1.7;
}
.detail-ans.empty { color: var(--text-3); font-style: italic; border-left-color: var(--border); }
.ref-img-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.ref-img-thumb {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid var(--border);
  cursor: pointer;
}
.detail-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 12px;
}
.btn-edit {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 12px;
  padding: 8px 14px;
  min-height: 36px;
  border-radius: 6px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  cursor: pointer;
  font-weight: 500;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.btn-edit:hover { border-color: var(--accent); color: var(--accent); }

/* REFERENCE IMAGES SECTION */
.ref-section {
  max-width: 720px;
  margin: 0 auto 0;
  padding: 0 20px 48px;
}
.ref-section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-2);
  letter-spacing: .05em;
  text-transform: uppercase;
  margin-bottom: 14px;
  padding-top: 28px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 6px;
}
.ref-group { margin-bottom: 24px; }
.ref-group-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-3);
  margin-bottom: 10px;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.ref-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
}
.ref-card {
  background: var(--surface);
  border-radius: 10px;
  border: 1px solid var(--border);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.ref-card img {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  display: block;
}
.ref-card-label {
  padding: 6px 8px;
  font-size: 11px;
  color: var(--text-2);
  font-weight: 500;
  line-height: 1.3;
}

/* LIGHTBOX */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,15,30,.88);
  z-index: 500;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
  padding: 20px;
}
.lightbox.open { display: flex; }
.lightbox img {
  max-width: 100%;
  max-height: 85vh;
  border-radius: 10px;
  object-fit: contain;
}
.lightbox-close {
  position: absolute;
  top: max(16px, env(safe-area-inset-top)); right: 16px;
  background: rgba(255,255,255,.15);
  color: #fff;
  border: none;
  border-radius: 50%;
  width: 44px; height: 44px;
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* FAB */
.edit-fab {
  position: fixed;
  bottom: calc(22px + env(safe-area-inset-bottom)); right: 18px;
  background: var(--navy);
  color: #fff;
  border: none;
  border-radius: 28px;
  padding: 13px 20px;
  min-height: 48px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  box-shadow: 0 4px 18px rgba(26,43,80,.22);
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: transform .15s, box-shadow .15s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.edit-fab:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(26,43,80,.28); }

/* MODAL */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(10,15,30,.55);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(3px);
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  width: 100%; max-width: 720px;
  max-height: 88vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 20px calc(44px + env(safe-area-inset-bottom));
}
.modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 14px auto 20px; }
.modal-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
.modal-sub { font-size: 12px; color: var(--text-3); margin-bottom: 20px; }
.form-group { margin-bottom: 14px; }
.form-label {
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 5px;
}
.form-input, .form-textarea, .form-select {
  width: 100%; padding: 9px 12px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 16px; color: var(--text);
  background: var(--surface-2); outline: none;
  transition: border-color .15s;
}
.form-input:focus, .form-textarea:focus, .form-select:focus {
  border-color: var(--accent); background: var(--surface);
}
.form-textarea { resize: vertical; min-height: 88px; line-height: 1.65; }
.form-readonly {
  padding: 9px 12px;
  background: var(--surface-2);
  border-radius: 8px;
  font-size: 13px; color: var(--text-2);
  line-height: 1.6;
  border: 1.5px solid var(--border);
}
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.btn-save {
  flex: 1; background: var(--navy); color: #fff;
  border: none; border-radius: 10px; padding: 14px;
  min-height: 48px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 15px; font-weight: 600; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.btn-save:hover { background: var(--navy-light); }
.btn-cancel {
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 18px;
  min-height: 48px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 15px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* TOAST */
.toast {
  display: none;
  position: fixed;
  bottom: calc(80px + env(safe-area-inset-bottom));
  left: 50%; transform: translateX(-50%);
  background: var(--navy);
  color: #fff;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 13px; font-weight: 500;
  z-index: 300;
  white-space: nowrap;
  max-width: calc(100vw - 40px);
  overflow: hidden;
  text-overflow: ellipsis;
  box-shadow: 0 4px 16px rgba(0,0,0,.18);
}
.toast.show { display: block; }
.empty-state {
  text-align: center; padding: 48px 20px; color: var(--text-3);
}
.empty-state strong { display: block; font-size: 15px; margin-bottom: 4px; color: var(--text-2); }
/* SMALL PHONE (< 375px) */
@media (max-width: 374px) {
  .chip-row { flex-wrap: nowrap; }
  .card-detail { padding: 10px 12px 12px; }
  .stat-num { font-size: 18px; }
  .page-header { padding: 20px 16px 18px; }
  .main { padding: 12px 14px 60px; }
  .filter-zone { padding: 9px 14px; }
  .ref-section { padding: 0 14px 48px; }
  .modal { padding: 0 16px calc(44px + env(safe-area-inset-bottom)); }
}
/* DESKTOP ENHANCEMENTS — 2x font sizes + wider layout */
@media (min-width: 540px) {
  /* wider content area */
  .page-header-inner, .stats-inner, .main, .ref-section { max-width: 1200px; }
  .filter-inner { max-width: 1200px; }

  /* 2x typography */
  .page-eyebrow { font-size: 13px; }
  .page-title { font-size: clamp(32px, 4vw, 46px); }
  .meta-row { font-size: 18px; }
  .stat-num { font-size: 38px; }
  .stat-label { font-size: 15px; }
  .result-count { font-size: 16px; }
  .card-request { font-size: 18px; }
  .card-num { font-size: 16px; }
  .tag { font-size: 14px; padding: 3px 8px; }
  .status-badge { font-size: 14px; padding: 4px 12px; }
  .detail-label { font-size: 14px; }
  .detail-ans { font-size: 17px; }
  .ans-preview-text { font-size: 16px; }
  .ref-card-label { font-size: 14px; }
  .modal-title { font-size: 22px; }
  .modal-sub { font-size: 15px; }
  .form-label { font-size: 13px; }
  .toast { font-size: 16px; }

  /* chip & inputs */
  .chip-row { flex-wrap: wrap; overflow-x: visible; }
  .chip { padding: 7px 16px; min-height: unset; font-size: 16px; }
  .search-input { font-size: 18px; }
  .form-input, .form-textarea, .form-select { font-size: 18px; padding: 11px 14px; }
  .form-readonly { font-size: 17px; }

  /* card layout */
  .card-header { padding: 18px 20px 14px; min-height: unset; }
  .card-detail { padding: 16px 20px 18px 56px; }
  .ref-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .ref-img-thumb { width: 110px; height: 110px; }

  /* buttons */
  .btn-save { padding: 14px; min-height: unset; font-size: 18px; }
  .btn-cancel { padding: 14px 20px; min-height: unset; font-size: 18px; }
  .btn-edit { padding: 8px 16px; min-height: unset; font-size: 15px; }
  .edit-fab { padding: 14px 22px; min-height: unset; font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) {
  .chevron, .chip, .edit-fab { transition: none; }
}
</style>

    </div>
  </div>
</header>
<div class="stats-bar">

const TEAMS = ['전체','제품디자인팀','FC팀','SCM팀'];
const STATUSES = ['전체','진행중','검토중'];
let filterTeam = '전체', filterStatus = '전체', searchQ = '';
let editItemId = null;

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function buildChips() {
  const cr = document.getElementById('chipRow');
  cr.innerHTML = '';
  TEAMS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'chip' + (filterTeam===t?' active':'');
    b.textContent = t; b.onclick = () => { filterTeam=t; buildChips(); renderCards(); };
    cr.appendChild(b);
  });
  const sep = document.createElement('span');
  sep.style.cssText = 'width:1px;height:18px;background:var(--border);align-self:center;flex-shrink:0;';
  cr.appendChild(sep);
  STATUSES.forEach(s => {
    const b = document.createElement('button');
    const cls = s==='진행중'?' ongoing':s==='검토중'?' review':'';
    b.className = 'chip'+cls+(filterStatus===s?' active':'');
    b.textContent = s; b.onclick = () => { filterStatus=s; buildChips(); renderCards(); };
    cr.appendChild(b);
  });
}

function filtered() {
  return ITEMS.filter(it => {
    if (filterTeam!=='전체' && it.team!==filterTeam) return false;
    if (filterStatus!=='전체' && it.status!==filterStatus) return false;
    if (searchQ && !it.req.includes(searchQ) && !it.cat.includes(searchQ) && !it.ans.includes(searchQ)) return false;
    return true;
  });
}

function renderCards() {
  const items = filtered();
  document.getElementById('resultCount').innerHTML = `<strong>${items.length}건</strong> 표시 중 (전체 ${ITEMS.length}건)`;
  document.getElementById('stat-total').textContent = ITEMS.length;
  document.getElementById('stat-ongoing').textContent = ITEMS.filter(i=>i.status==='진행중').length;
  document.getElementById('stat-review').textContent = ITEMS.filter(i=>i.status==='검토중').length;

  if (!items.length) {
    document.getElementById('cardList').innerHTML = '<div class="empty-state"><strong>검색 결과 없음</strong>다른 조건으로 검색해보세요.</div>';
    return;
  }

  document.getElementById('cardList').innerHTML = items.map(it => {
    const badge = it.status==='진행중' ? 'status-ongoing' : 'status-review';
    const hasAns = it.ans && it.ans.trim();
    const ansPreview = hasAns ? `<div class="card-ans-preview"><span class="ans-icon">💬</span><span class="ans-preview-text">${esc(it.ans)}</span></div>` : '';

    // inline reference images
    const itemImgs = IMG_MAP[String(it.id)] || [];
    const thumbs = itemImgs.length ? `<div class="ref-img-row">${itemImgs.map(src=>`<img class="ref-img-thumb" src="${src}" onclick="openLightbox(this.src)">`).join('')}</div>` : '';

    return `<div class="card" id="card-${it.id}">
  <div class="card-header" onclick="toggleCard(${it.id})">
    <span class="card-num">${it.id}</span>
    <div class="card-body-text">
      <div class="card-tags">
        <span class="tag">${esc(it.team)}</span>
        <span class="tag">${esc(it.cat)}</span>
        ${it.deadline?`<span class="tag deadline">📅 ${esc(it.deadline)}`+'</span>':''}
      </div>
      <div class="card-request">${esc(it.req)}</div>
      ${ansPreview}
    </div>
    <div class="card-right">
      <span class="status-badge ${badge}">${esc(it.status)}</span>
      <span class="chevron">▾</span>
    </div>
  </div>
  <div class="card-detail">
    <div class="detail-label">답변 · 조치 내용</div>
    <div class="detail-ans ${hasAns?'':'empty'}">${hasAns?esc(it.ans):'아직 답변이 없습니다.'}</div>
    ${thumbs}
    <div class="detail-actions">
      <button class="btn-edit" onclick="openEdit(${it.id})">✏️ 수정</button>
    </div>
  </div>
</div>`;
  }).join('');
}

function toggleCard(id) { document.getElementById('card-'+id).classList.toggle('open'); }

function openEdit(id) {
  const it = ITEMS.find(i=>i.id===id); if (!it) return;
  editItemId = id;
  document.getElementById('modalTitle').textContent = `No.${it.id} 수정`;
  document.getElementById('modalSub').textContent = `${it.team} · ${it.cat}`;
  document.getElementById('modalBody').innerHTML = `
<div class="form-group"><label class="form-label">요청사항</label><div class="form-readonly">${esc(it.req)}</div></div>
<div class="form-group"><label class="form-label" for="eAns">답변 · 조치 내용</label><textarea class="form-textarea" id="eAns" rows="5">${esc(it.ans)}</textarea></div>
<div class="form-group"><label class="form-label" for="eSt">상태</label>
<select class="form-select" id="eSt">
  <option value="진행중" ${it.status==='진행중'?'selected':''}>진행중</option>
  <option value="검토중" ${it.status==='검토중'?'selected':''}>검토중</option>
  <option value="완료" ${it.status==='완료'?'selected':''}>완료</option>
</select></div>
<div class="form-group"><label class="form-label" for="eDl">마감일</label><input class="form-input" type="text" id="eDl" value="${esc(it.deadline)}" placeholder="예: 9/30(수)"></div>`;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
  editItemId = null;
}

function saveItem() {
  if (!editItemId) return;
  const idx = ITEMS.findIndex(i=>i.id===editItemId); if (idx<0) return;
  ITEMS[idx].ans = document.getElementById('eAns').value;
  ITEMS[idx].status = document.getElementById('eSt').value;
  ITEMS[idx].deadline = document.getElementById('eDl').value;
  closeModal(); renderCards();
  const card = document.getElementById('card-'+editItemId);
  if (card) card.classList.add('open');
  showToast('저장되었습니다.');
  tryPublish();
}

function showToast(msg, duration=2200) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), duration);
}

function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

// GitHub Pages: download updated HTML after editing
function tryPublish() {
  const dataStr = JSON.stringify(ITEMS);
  const updatedHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML.replace(/let ITEMS = \[[\s\S]*?\];/, 'let ITEMS = ' + dataStr + ';');
  const blob = new Blob([updatedHtml], {type: 'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'index.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('index.html 다운로드 완료 — GitHub에 업로드해 주세요 ✓', 4000);
}

function buildPublishHtml() {
  const dataStr = JSON.stringify(ITEMS);
  return document.documentElement.outerHTML.replace(/let ITEMS = \[[\s\S]*?\];/, 'let ITEMS = ' + dataStr + ';');
}

document.getElementById('editFab').onclick = () => openEdit(ITEMS[0].id);
document.getElementById('searchInput').addEventListener('input', e=>{ searchQ=e.target.value.trim(); renderCards(); });
document.getElementById('modalOverlay').addEventListener('click', e=>{ if (e.target===document.getElementById('modalOverlay')) closeModal(); });

buildChips();
renderCards();
</script>
